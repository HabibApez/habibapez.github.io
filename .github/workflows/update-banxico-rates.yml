name: Update Banxico rates (rates-data branch)

on:
  schedule:
    # Every Wednesday at 14:00 UTC (after Mexico's weekly Tuesday primary auction)
    - cron: "0 14 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-banxico-rates
  cancel-in-progress: false

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main (read-only script source)
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts/update_banxico_rates.py
            .github/scripts/fiscal_mx.json
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Prepare isolated rates-data working directory
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DATA_DIR="/tmp/rates-data"
          rm -rf "$DATA_DIR"
          mkdir -p "$DATA_DIR"
          cd "$DATA_DIR"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          if git ls-remote --exit-code --heads origin rates-data >/dev/null 2>&1; then
            git fetch --depth=1 origin rates-data
            git checkout -q -b rates-data FETCH_HEAD
          else
            git checkout -q --orphan rates-data
          fi

      - name: Fetch Banxico SIE series and generate rates.json
        id: fetch
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        run: |
          python3 .github/scripts/update_banxico_rates.py \
            --previous /tmp/rates-data/rates.json \
            --fiscal .github/scripts/fiscal_mx.json \
            --output /tmp/rates-data/rates.json

      - name: Commit and push to rates-data only if numeric values changed
        if: steps.fetch.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cd /tmp/rates-data
          git add rates.json
          if git diff --cached --quiet; then
            echo "No staged changes in rates.json."
            exit 0
          fi
          git commit -m "chore(rates): update Banxico SIE rates (${{ steps.fetch.outputs.updated_at }})"
          git push origin rates-data

      - name: Open GitHub Issue if annual fiscal parameters or Art. 152 ISR table need review
        if: steps.fetch.outputs.fiscal_alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REASON: ${{ steps.fetch.outputs.fiscal_reason }}
        run: |
          set -euo pipefail
          TITLE="Fiscal update check: review MX SM, UMA, LIF withholding, and Art. 96 ISR table"
          EXISTING=$(gh issue list --repo "$REPO" --state open --search "$TITLE in:title" --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "Fiscal review issue already open; skipping duplicate."
            exit 0
          fi
          gh issue create --repo "$REPO" \
            --title "$TITLE" \
            --body "$(printf 'Automated check triggered by `update-banxico-rates.yml`:\n\n- **Reason:** %s\n\n### Checklist\n1. Verify official DOF values for Salario Mínimo (`sm`), UMA (`uma`), LIF interest withholding (`ret`), and Anexo 8 RMF monthly ISR brackets (`isr_m`).\n2. Update `.github/scripts/fiscal_mx.json` on `main` (and `inpc_base_value` / `inpc_base_date` if Art. 96 brackets changed).\n3. Re-run `Update Banxico rates (rates-data branch)` via `workflow_dispatch` to publish the updated `fiscal` block into `rates-data/rates.json`.' "$REASON")"
